
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08111f">
<title>Neon Snake Game</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top,#172b49,#08111f 65%);
  color:#fff;font-family:Arial,sans-serif
}
.game{width:min(100%,460px);text-align:center}
h1{margin:0 0 8px;color:#45ffb0;font-size:clamp(28px,7vw,42px)}
.sub{color:#a8b8d0;margin:0 0 20px}
.stats{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.stat{flex:1;padding:12px;border:1px solid #30435c;border-radius:12px;background:#101e31}
.stat small{display:block;color:#9aacc4;margin-bottom:5px}
.stat strong{font-size:22px;color:#45ffb0}
.board-wrap{position:relative}
canvas{width:100%;aspect-ratio:1;display:block;border:2px solid #314962;border-radius:14px;background:#091522;touch-action:none}
.overlay{
 position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;flex-direction:column;gap:12px;
 border-radius:14px;background:#07111ddd;padding:20px
}
.overlay.hidden{display:none}
.overlay h2{font-size:28px;margin:0}
.overlay p{color:#c4d1e1;line-height:1.5}
button{
 border:0;border-radius:12px;padding:12px 20px;
 background:#45ffb0;color:#06151a;font-weight:bold;
 font-size:15px;cursor:pointer
}
button:active{transform:scale(.96)}
.controls{margin:18px auto 0;display:grid;grid-template-columns:repeat(3,65px);gap:8px;justify-content:center}
.controls button{padding:14px 0;font-size:21px;background:#172941;color:white;border:1px solid #344b65}
.controls .empty{visibility:hidden}
.help{color:#91a3bc;font-size:12px;line-height:1.6;margin-top:16px}
</style>
</head>
<body>
<main class="game">
  <h1>🐍 NEON SNAKE</h1>
  <p class="sub">Eat, grow and beat your high score!</p>

  <div class="stats">
    <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="message">Ready to Play?</h2>
      <p id="details">Use arrow keys or WASD to move.</p>
      <button id="start">▶ START GAME</button>
    </div>
  </div>

  <div class="controls">
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="up" aria-label="Up">▲</button>
    <button class="empty" tabindex="-1"> </button>
    <button data-dir="left" aria-label="Left">◀</button>
    <button data-dir="down" aria-label="Down">▼</button>
    <button data-dir="right" aria-label="Right">▶</button>
  </div>

  <p class="help">
    PC: Arrow Keys / WASD · Mobile: Use the buttons above<br>
    Eat the glowing food. Avoid walls and your own tail!
  </p>
</main>

<script>
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const message = document.getElementById("message");
  const details = document.getElementById("details");
  const startBtn = document.getElementById("start");

  const SIZE = 20;
  const CELLS = canvas.width / SIZE;
  let snake, food, direction, nextDirection, score;
  let running = false, timer = null;
  let best = 0;

  try {
    best = Number(localStorage.getItem("neonSnakeBest") || 0);
  } catch (_) {}
  bestEl.textContent = best;

  function randomFood() {
    let p;
    do {
      p = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS)
      };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    return p;
  }

  function reset() {
    snake = [
      {x: 10, y: 10},
      {x: 9, y: 10},
      {x: 8, y: 10}
    ];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    score = 0;
    food = randomFood();
    scoreEl.textContent = score;
    draw();
  }

  function draw() {
    ctx.fillStyle = "#091522";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#122439";
    ctx.lineWidth = 1;
    for (let i = 0; i <= CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * SIZE, 0);
      ctx.lineTo(i * SIZE, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * SIZE);
      ctx.lineTo(canvas.width, i * SIZE);
      ctx.stroke();
    }

    ctx.fillStyle = "#ff4f91";
    ctx.shadowColor = "#ff4f91";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(
      food.x * SIZE + SIZE/2,
      food.y * SIZE + SIZE/2,
      SIZE * .34, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#a2ffdc" : "#35e99b";
      ctx.shadowColor = "#35e99b";
      ctx.shadowBlur = i === 0 ? 12 : 3;
      ctx.beginPath();
      ctx.roundRect(
        s.x * SIZE + 2, s.y * SIZE + 2,
        SIZE - 4, SIZE - 4, 5
      );
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    const head = snake[0];
    ctx.fillStyle = "#06151a";
    if (direction.x !== 0) {
      ctx.fillRect(head.x*SIZE + (direction.x > 0 ? 13 : 5),
                   head.y*SIZE + 5, 3, 3);
      ctx.fillRect(head.x*SIZE + (direction.x > 0 ? 13 : 5),
                   head.y*SIZE + 12, 3, 3);
    } else {
      ctx.fillRect(head.x*SIZE + 5,
                   head.y*SIZE + (direction.y > 0 ? 13 : 5), 3, 3);
      ctx.fillRect(head.x*SIZE + 12,
                   head.y*SIZE + (direction.y > 0 ? 13 : 5), 3, 3);
    }
  }

  function tick() {
    if (!running) return;
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    const eating = head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);

    if (
      head.x < 0 || head.y < 0 ||
      head.x >= CELLS || head.y >= CELLS ||
      body.some(s => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (eating) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("neonSnakeBest", best); } catch (_) {}
      }
      food = randomFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function startGame() {
    clearInterval(timer);
    reset();
    running = true;
    overlay.classList.add("hidden");
    timer = setInterval(tick, 115);
  }

  function endGame() {
    running = false;
    clearInterval(timer);
    message.textContent = "💥 Game Over!";
    details.textContent = "Your score: " + score + " · Best: " + best;
    startBtn.textContent = "↻ PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  function setDirection(name) {
    const dirs = {
      up: {x: 0, y: -1},
      down: {x: 0, y: 1},
      left: {x: -1, y: 0},
      right: {x: 1, y: 0}
    };
    const d = dirs[name];
    if (!d) return;
    if (d.x === -direction.x && d.y === -direction.y) return;
    nextDirection = d;
  }

  document.addEventListener("keydown", e => {
    const keys = {
      ArrowUp: "up", w: "up", W: "up",
      ArrowDown: "down", s: "down", S: "down",
      ArrowLeft: "left", a: "left", A: "left",
      ArrowRight: "right", d: "right", D: "right"
    };
    if (keys[e.key]) {
      e.preventDefault();
      setDirection(keys[e.key]);
    }
    if (e.key === " " && !running) startGame();
  });

  document.querySelectorAll("[data-dir]").forEach(btn => {
    btn.addEventListener("click", () => setDirection(btn.dataset.dir));
  });

  startBtn.addEventListener("click", startGame);

  reset();
})();
</script>
</body>
</html>
