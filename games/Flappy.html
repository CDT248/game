
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071426">
<title>Flappy Bird | Fahim Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at top,#183b65,#071426 70%);
  color:white;font-family:Arial,sans-serif;padding:12px;overflow:hidden
}
.shell{width:min(100%,440px);text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:22px;font-weight:900}
.logo span{color:#48e8ff}
button{cursor:pointer;touch-action:manipulation}
.sound{border:1px solid #ffffff35;background:#ffffff12;color:white;border-radius:10px;padding:9px 12px}
.frame{
  position:relative;width:100%;aspect-ratio:4/5;max-height:78vh;
  overflow:hidden;border:2px solid #62eaff;border-radius:18px;
  box-shadow:0 0 35px #00d9ff30;background:#74d8ff
}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.stat{background:#071426bb;border:1px solid #ffffff40;border-radius:11px;padding:7px 13px;font-size:11px;color:#c9f5ff}
.stat b{display:block;font-size:24px;color:white;margin-top:3px}
.overlay{
 position:absolute;inset:0;background:#061426bd;backdrop-filter:blur(5px);
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px
}
.overlay.hide{display:none}
.overlay h1{font-size:clamp(30px,8vw,44px);font-weight:1000;text-shadow:0 4px #087eac;margin-bottom:12px}
.overlay p{line-height:1.7;margin-bottom:20px;color:#e0f7ff}
.play{
 border:0;border-radius:13px;padding:14px 27px;background:linear-gradient(135deg,#a5ff67,#20e6b5);
 color:#06212b;font-size:17px;font-weight:900;box-shadow:0 5px #087f72
}
.play:active{transform:translateY(2px);box-shadow:0 3px #087f72}
.info{display:flex;justify-content:space-between;gap:5px;margin-top:12px;font-size:11px;color:#b8d3e8}
@media(max-height:650px){.frame{max-height:72vh}.top{margin-bottom:6px}.info{margin-top:6px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="logo">🐤 FLAPPY <span>BIRD</span></div>
    <button class="sound" id="sound">🔊 Sound ON</button>
  </div>

  <div class="frame">
    <canvas id="game" width="400" height="500"></canvas>

    <div class="hud">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">BEST<b id="best">0</b></div>
    </div>

    <div class="overlay" id="overlay">
      <h1 id="title">FLAPPY BIRD</h1>
      <p id="message">Tap, click or press SPACE to fly.<br>Avoid the pipes and beat your best score!</p>
      <button class="play" id="play">▶ PLAY NOW</button>
    </div>
  </div>

  <div class="info">
    <span>⌨️ SPACE / ↑</span>
    <span>📱 TAP TO FLY</span>
    <span>🏆 HIGH SCORE</span>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const title = document.getElementById("title");
const message = document.getElementById("message");
const playBtn = document.getElementById("play");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const soundBtn = document.getElementById("sound");

const W = 400, H = 500, GROUND = 58, PIPE_W = 66, GAP = 155;
let mode = "ready", score = 0, best = 0, pipes = [];
let bird, elapsed = 0, lastTime = 0, groundOffset = 0, soundOn = true;
let audio = null;

try { best = Number(localStorage.getItem("flappyBestScore") || 0); } catch(e) {}
bestText.textContent = best;

function beep(freq, duration=0.07) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.06, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime + duration);
  } catch(e) {}
}

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊 Sound ON" : "🔇 Sound OFF";
  if (soundOn) beep(600);
});

function newPipe(x) {
  return {x, top: 55 + Math.random()*210, passed:false};
}

function reset() {
  score = 0;
  elapsed = 0;
  pipes = [newPipe(460), newPipe(670)];
  bird = {x:100,y:220,vy:0,r:15,rotation:0};
  groundOffset = 0;
  scoreText.textContent = "0";
}

function start() {
  reset();
  mode = "playing";
  overlay.classList.add("hide");
  flap();
  lastTime = performance.now();
}

function flap() {
  if (mode !== "playing") return;
  bird.vy = -390;
  beep(580,0.05);
}

function gameOver() {
  if (mode !== "playing") return;
  mode = "over";
  beep(170,0.22);
  if (score > best) {
    best = score;
    bestText.textContent = best;
    try { localStorage.setItem("flappyBestScore",String(best)); } catch(e) {}
  }
  title.textContent = "GAME OVER!";
  message.innerHTML = "Your Score: <b>"+score+"</b><br>Best Score: <b>"+best+"</b><br>Try again and fly further!";
  playBtn.textContent = "↻ PLAY AGAIN";
  overlay.classList.remove("hide");
}

playBtn.addEventListener("click", start);

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (mode === "playing") flap();
  else start();
});

document.addEventListener("keydown", e => {
  if (["Space","ArrowUp","KeyW"].includes(e.code)) {
    e.preventDefault();
    if (mode === "playing") flap();
    else start();
  }
});

function cloud(x,y,s) {
  ctx.fillStyle = "#ffffffb9";
  ctx.beginPath();
  ctx.arc(x,y,16*s,0,Math.PI*2);
  ctx.arc(x+19*s,y-10*s,21*s,0,Math.PI*2);
  ctx.arc(x+42*s,y,16*s,0,Math.PI*2);
  ctx.arc(x+22*s,y+7*s,19*s,0,Math.PI*2);
  ctx.fill();
}

function background() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#53c8ff"); g.addColorStop(1,"#d2f8ff");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#fff6b4";
  ctx.beginPath(); ctx.arc(320,75,23,0,Math.PI*2); ctx.fill();

  let shift = (elapsed*12)%(W+100);
  cloud(65-shift*.4,105,.8);
  cloud(285-shift*.4,165,.95);
  cloud(450-shift*.4,65,.65);

  ctx.fillStyle="#79d9b1";
  ctx.beginPath();
  ctx.moveTo(0,410);
  ctx.quadraticCurveTo(65,300,135,410);
  ctx.quadraticCurveTo(230,305,300,410);
  ctx.quadraticCurveTo(350,335,W,410);
  ctx.lineTo(W,442);ctx.lineTo(0,442);ctx.fill();
}

function pipeDraw(p) {
  const bottom = p.top + GAP;
  const groundY = H-GROUND;
  const gr = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
  gr.addColorStop(0,"#13823e");
  gr.addColorStop(.3,"#56e36e");
  gr.addColorStop(.65,"#29b94b");
  gr.addColorStop(1,"#087438");

  ctx.fillStyle=gr;
  ctx.fillRect(p.x,0,PIPE_W,p.top-16);
  ctx.fillRect(p.x,bottom+16,PIPE_W,groundY-bottom-16);

  ctx.fillStyle="#2bd052";
  ctx.fillRect(p.x-5,p.top-22,PIPE_W+10,22);
  ctx.fillRect(p.x-5,bottom,PIPE_W+10,22);

  ctx.strokeStyle="#087b3c";ctx.lineWidth=3;
  ctx.strokeRect(p.x,0,PIPE_W,p.top-16);
  ctx.strokeRect(p.x,bottom+16,PIPE_W,groundY-bottom-16);
  ctx.strokeRect(p.x-5,p.top-22,PIPE_W+10,22);
  ctx.strokeRect(p.x-5,bottom,PIPE_W+10,22);

  ctx.fillStyle="#c4ffc84f";
  ctx.fillRect(p.x+10,0,7,p.top-22);
  ctx.fillRect(p.x+10,bottom+22,7,groundY-bottom-22);
}

function birdDraw() {
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.rotation);

  ctx.fillStyle="#ff9c25";
  ctx.beginPath();ctx.moveTo(-13,1);ctx.lineTo(-25,-5);ctx.lineTo(-22,7);ctx.closePath();ctx.fill();

  const gr=ctx.createLinearGradient(-15,-15,15,15);
  gr.addColorStop(0,"#fff27a");gr.addColorStop(.65,"#ffc62e");gr.addColorStop(1,"#ff8c21");
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.ellipse(0,0,18,15,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#d77716";ctx.lineWidth=2;ctx.stroke();

  ctx.fillStyle="#ffad28";
  ctx.beginPath();ctx.ellipse(-5,5+Math.sin(elapsed*16)*2,9,6,-.3,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(9,-6,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#17202c";ctx.beginPath();ctx.arc(11,-6,2.5,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#ff6b35";
  ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(27,4);ctx.lineTo(14,8);ctx.closePath();ctx.fill();
  ctx.restore();
}

function groundDraw() {
  const y=H-GROUND;
  ctx.fillStyle="#e8c46c";ctx.fillRect(0,y,W,GROUND);
  ctx.fillStyle="#64dc68";ctx.fillRect(0,y,W,13);
  ctx.fillStyle="#2da84b";ctx.fillRect(0,y+10,W,5);
  ctx.save();ctx.beginPath();ctx.rect(0,y+15,W,GROUND-15);ctx.clip();
  ctx.strokeStyle="#c59a47";ctx.lineWidth=2;
  for(let x=-30-groundOffset;x<W+30;x+=28){
    ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x-18,H);ctx.stroke();
  }
  ctx.restore();
}

function collision(p) {
  const r=13;
  if(bird.x+r<p.x || bird.x-r>p.x+PIPE_W) return false;
  return bird.y-r<p.top || bird.y+r>p.top+GAP;
}

function update(dt) {
  elapsed+=dt;

  if(mode==="ready"){
    bird.y=220+Math.sin(elapsed*3)*8;
    bird.rotation=Math.sin(elapsed*2)*.05;
    groundOffset=(groundOffset+25*dt)%28;
    return;
  }
  if(mode!=="playing") return;

  const speed=Math.min(205+score*3,300);
  bird.vy+=1150*dt;
  bird.y+=bird.vy*dt;
  bird.rotation=Math.min(Math.PI/3,Math.max(-.45,bird.vy/600));
  groundOffset=(groundOffset+speed*dt)%28;

  for(const p of pipes){
    p.x-=speed*dt;
    if(!p.passed && p.x+PIPE_W<bird.x){
      p.passed=true;score++;scoreText.textContent=score;beep(850,.06);
    }
    if(collision(p)){gameOver();return;}
  }

  pipes=pipes.filter(p=>p.x+PIPE_W>-5);
  while(pipes.length<3){
    const farthest=pipes.length?Math.max(...pipes.map(p=>p.x)):W;
    pipes.push(newPipe(farthest+205));
  }

  if(bird.y-bird.r<0 || bird.y+bird.r>H-GROUND) gameOver();
}

function draw() {
  background();
  pipes.forEach(pipeDraw);
  groundDraw();
  birdDraw();
}

function loop(now) {
  const dt=Math.min((now-lastTime)/1000||0,.035);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(now=>{lastTime=now;requestAnimationFrame(loop);});
})();
</script>
</body>
</html>
