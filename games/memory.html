<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10132b">
<title>Memory Match Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#090b19;--panel:#151a35;--line:rgba(183,190,255,.18);--text:#f7f7ff;--muted:#b1b8d8;--purple:#a78bfa;--blue:#60a5fa;--green:#6ee7b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#34205d 0,transparent 35%),radial-gradient(circle at 100% 30%,#112c56 0,transparent 32%),var(--bg)}
.wrap{width:min(920px,94%);margin:auto;padding:28px 0 42px}.top{text-align:center;padding:15px 0 22px}.logo{font-size:43px;line-height:1.3}.top h1{font-size:clamp(28px,5vw,43px);margin:6px 0;background:linear-gradient(90deg,#c4b5fd,#93c5fd);background-clip:text;color:transparent;letter-spacing:-1px}.top p{color:var(--muted);margin:0;font-size:14px}.home-link{display:inline-block;margin-top:15px;padding:9px 14px;border:1px solid var(--line);border-radius:11px;color:var(--text);background:#20264a;text-decoration:none;font-size:13px;font-weight:700}.home-link:hover{border-color:var(--purple)}.panel{background:rgba(20,25,51,.88);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px #0004;backdrop-filter:blur(15px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#0c1026;border:1px solid var(--line);border-radius:14px;text-align:center;padding:12px 6px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:22px;margin-top:3px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:18px}.controls label{color:var(--muted);font-size:13px}.controls select,.controls button{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#20264a;color:var(--text);font:inherit}.controls button{cursor:pointer;font-weight:700}.controls button.primary{background:linear-gradient(135deg,var(--purple),var(--blue));color:#11132a;border:0}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{aspect-ratio:1/1;min-width:0;border:1px solid rgba(180,190,255,.22);border-radius:16px;background:linear-gradient(145deg,#262d59,#171d3d);display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,border-color .18s,background .18s;user-select:none}.card:hover{transform:translateY(-2px);border-color:#a78bfa}.card:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.card .face{font-size:clamp(24px,5vw,45px);opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s}.card:before{content:"✦";font-size:clamp(25px,5vw,42px);color:#9da7e7;text-shadow:0 0 20px #818cf855}.card.open,.card.matched{background:linear-gradient(145deg,#e0e7ff,#c4b5fd);border-color:#c4b5fd;cursor:default}.card.open:before,.card.matched:before{display:none}.card.open .face,.card.matched .face{opacity:1;transform:scale(1)}.card.matched{background:linear-gradient(145deg,#a7f3d0,#6ee7b7);border-color:#6ee7b7}.card.matched .face{filter:none}.message{display:none;text-align:center;padding:19px 12px 3px;font-size:17px;font-weight:750;color:var(--green)}.message.show{display:block}.hint{text-align:center;color:var(--muted);font-size:12px;margin:17px 0 0;line-height:1.7}.footer{text-align:center;color:#8790b5;font-size:11px;margin-top:17px}
@media(min-width:650px){.board{gap:13px}.panel{padding:24px}}@media(max-width:420px){.wrap{padding-top:12px}.panel{padding:12px;border-radius:17px}.board{gap:7px}.card{border-radius:12px}.stats{gap:6px}.stat{padding:10px 4px}.stat strong{font-size:19px}.controls{gap:7px}.controls select,.controls button{padding:9px 10px;font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="logo">🧠</div><h1>Memory Match</h1><p>একই রকম দুটি কার্ড খুঁজে সব জোড়া মেলাও!</p><a class="home-link" href="../">← Back to Website</a></header>
  <section class="panel" aria-label="Memory game">
    <div class="stats">
      <div class="stat"><span>সময়</span><strong id="time">00:00</strong></div>
      <div class="stat"><span>চাল</span><strong id="moves">0</strong></div>
      <div class="stat"><span>মিলেছে</span><strong id="matches">0 / 8</strong></div>
    </div>
    <div class="controls">
      <label for="difficulty">লেভেল</label>
      <select id="difficulty"><option value="8">সহজ · ৮ জোড়া</option><option value="10">মাঝারি · ১০ জোড়া</option><option value="12">কঠিন · ১২ জোড়া</option></select>
      <button class="primary" id="restart" type="button">↻ নতুন গেম</button>
    </div>
    <div class="board" id="board" aria-label="কার্ড বোর্ড"></div>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <p class="hint">কার্ডে ক্লিক করে ছবি দেখো। দুটি ছবি একই হলে সেগুলো মিলে যাবে।</p>
  </section>
  <footer class="footer">MEMORY MATCH GAME · Works offline · Mobile friendly</footer>
</main>
<script>
(() => {
  'use strict';
  const symbols = ['🍎','🚀','🐼','🎧','🌈','⚽','🍕','🦋','🐸','🎮','🌻','🚗'];
  const $ = id => document.getElementById(id);
  let first = null, second = null, locked = false, moves = 0, matched = 0, seconds = 0, timer = null, started = false;

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  function formatTime(total) {
    return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  }
  function startTimer() {
    if (timer || !started) return;
    timer = setInterval(() => { seconds++; $('time').textContent = formatTime(seconds); }, 1000);
  }
  function stopTimer() { if (timer) clearInterval(timer); timer = null; }
  function updateStats() {
    $('moves').textContent = String(moves);
    $('matches').textContent = matched + ' / ' + Number($('difficulty').value);
  }
  function newGame() {
    stopTimer(); first = null; second = null; locked = false; moves = 0; matched = 0; seconds = 0; started = false;
    $('time').textContent = '00:00'; $('message').classList.remove('show'); $('message').textContent = '';
    const pairs = Number($('difficulty').value);
    const deck = shuffle([...symbols.slice(0, pairs), ...symbols.slice(0, pairs)]);
    const board = $('board'); board.innerHTML = '';
    board.style.gridTemplateColumns = pairs >= 10 ? 'repeat(6,minmax(0,1fr))' : 'repeat(4,minmax(0,1fr))';
    deck.forEach((symbol, index) => {
      const card = document.createElement('button');
      card.type = 'button'; card.className = 'card'; card.dataset.symbol = symbol;
      card.setAttribute('aria-label', 'কার্ড ' + (index + 1) + ', ঢাকা');
      card.innerHTML = '<span class="face" aria-hidden="true">' + symbol + '</span>';
      card.addEventListener('click', () => flipCard(card, index));
      board.appendChild(card);
    });
    updateStats();
  }
  function flipCard(card, index) {
    if (locked || card.classList.contains('open') || card.classList.contains('matched')) return;
    if (!started) { started = true; startTimer(); }
    card.classList.add('open'); card.setAttribute('aria-label', 'কার্ড ' + (index + 1) + ', ' + card.dataset.symbol);
    if (!first) { first = card; return; }
    second = card; moves++; updateStats();
    if (first.dataset.symbol === second.dataset.symbol) {
      first.classList.add('matched'); second.classList.add('matched');
      first.setAttribute('aria-label', 'মিলে গেছে'); second.setAttribute('aria-label', 'মিলে গেছে');
      matched++; first = null; second = null; updateStats();
      if (matched === Number($('difficulty').value)) {
        stopTimer(); $('message').textContent = '🎉 অভিনন্দন! ' + moves + ' চালে ' + $('time').textContent + ' সময়ে সব জোড়া মিলিয়েছ!';
        $('message').classList.add('show');
      }
    } else {
      locked = true;
      const a = first, b = second;
      setTimeout(() => {
        a.classList.remove('open'); b.classList.remove('open');
        a.setAttribute('aria-label', 'কার্ড, ঢাকা'); b.setAttribute('aria-label', 'কার্ড, ঢাকা');
        first = null; second = null; locked = false;
      }, 750);
    }
  }
  $('restart').addEventListener('click', newGame);
  $('difficulty').addEventListener('change', newGame);
  newGame();
})();
</script>
</body>
</html>
