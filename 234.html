<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bangladesh Rickshaw & Bus 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101a20;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
canvas{display:block}
#top{position:fixed;top:0;left:0;right:0;padding:10px;
background:linear-gradient(#07151de8,transparent);pointer-events:none}
#top h3{margin:0 0 6px;font-size:17px}
#stats{display:flex;gap:15px;font-size:13px;flex-wrap:wrap}
#menu{position:fixed;top:90px;left:10px;display:flex;gap:6px}
button,select{border:1px solid #ffffff44;border-radius:12px;
padding:12px;background:#153d37;color:white;font-weight:bold;font-size:14px}
button:active{background:#e4b942;color:#17221b}
#controls{position:fixed;bottom:15px;left:0;right:0;
display:flex;justify-content:space-between;align-items:end;padding:0 12px;
pointer-events:none}
.group{display:flex;gap:8px;align-items:end;pointer-events:auto}
.control{width:58px;height:58px;background:#102b29d9;font-size:22px;
border:2px solid #ffffff55;touch-action:none;user-select:none}
#gas{height:78px;background:#13754d}
#brake{height:68px;background:#8e3430}
#horn{width:52px;height:52px}
#message{position:fixed;top:42%;width:100%;text-align:center;
font-size:19px;font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none}
#maplink{position:fixed;right:8px;top:8px;font-size:11px;color:white;
background:#132b25b8;padding:7px;border-radius:8px;text-decoration:none}
#help{position:fixed;bottom:108px;left:0;right:0;text-align:center;
font-size:11px;color:white;text-shadow:0 1px 3px black;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
<h3>🇧🇩 Chattogram Traffic Driver 3D</h3>
<div id="stats">
<span>গাড়ি: <b id="vname">রিকশা</b></span>
<span>গতি: <b id="spd">0</b> km/h</span>
<span>দূরত্ব: <b id="dist">0</b> m</span>
<span>স্কোর: <b id="score">0</b></span>
</div>
</div>

<div id="menu">
<select id="vehicle" aria-label="গাড়ি">
<option value="rickshaw">🛺 রিকশা</option>
<option value="bus">🚌 লোকাল বাস</option>
<option value="cng">🟢 CNG</option>
<option value="truck">🚚 ট্রাক</option>
<option value="car">🚗 কার</option>
</select>
<button id="pause">Ⅱ বিরতি</button>
<button id="restart">↻</button>
</div>

<a id="maplink" href="https://www.openstreetmap.org/#map=16/22.359/91.778"
target="_blank" rel="noopener">📍 পাহাড়তলী ম্যাপ ↗</a>

<div id="message">লোড হচ্ছে...</div>
<div id="help">◀ ▶ স্টিয়ারিং · ▲ গতি · ▼ ব্রেক · H হর্ন</div>

<div id="controls">
<div class="group">
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
</div>
<div class="group">
<button class="control" id="horn">📣</button>
<button class="control" id="brake">▼</button>
<button class="control" id="gas">▲</button>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ed5ef);
scene.fog=new THREE.Fog(0x9ed5ef,65,230);

const camera=new THREE.PerspectiveCamera(
68,innerWidth/innerHeight,.1,500);
camera.position.set(0,4,9);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe4f4ff,0x536548,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-15,28,10);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.82});
const grass=mat(0x659957), asphalt=mat(0x41464b);
const white=mat(0xf0ead0), red=mat(0xc92e2e);
const glass=mat(0x7ec7d7), black=mat(0x202426);
const yellow=mat(0xe5b839), green=mat(0x16864b);

function cube(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(parent,x,y,z,r,h,material,rot=0){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),material);
 m.position.set(x,y,z);m.rotation.z=rot;m.castShadow=true;
 parent.add(m);return m;
}

// Ground and road
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,500),grass);
ground.rotation.x=-Math.PI/2;ground.position.z=-170;
ground.receiveShadow=true;scene.add(ground);

const road=cube(scene,0,-.08,-170,12,.12,500,asphalt);

// Road edges and broken centre line
for(const x of [-5.75,5.75]){
 cube(scene,x,.01,-170,.12,.04,500,white);
}
const stripes=[];
for(let i=0;i<30;i++){
 const s=cube(scene,0,.015,-i*10, .13,.04,4,white);
 stripes.push(s);
}

// Shops, homes, trees
const buildings=[];
const shopNames=['চায়ের দোকান','মুদি স্টোর','ফার্মেসি',
'গ্যারেজ','হোটেল','মোবাইল সার্ভিস','কনফেকশনারি'];

function makeBuilding(x,z,i){
 const g=new THREE.Group();g.position.set(x,0,z);
 const colors=[0xd9b991,0xd8d4ba,0xd29b91,0xc1cbb7,0xe1c779];
 cube(g,0,2,0,4,4,4,mat(colors[i%colors.length]));
 cube(g,0,4.1,0,4.3,.3,4.3,red);
 cube(g,0,1.4,2.02,1.4,1.4,.08,glass);
 cube(g,-1.1,2.8,2.02,.6,.7,.08,glass);
 cube(g,1.1,2.8,2.02,.6,.7,.08,glass);
 cube(g,0,2.05,2.1,2.7,.5,.1,yellow);
 buildings.push(g);scene.add(g);

 // Shop sign
 const c=document.createElement('canvas');
 c.width=256;c.height=64;
 const ctx=c.getContext('2d');
 ctx.fillStyle='#164e39';ctx.fillRect(0,0,256,64);
 ctx.fillStyle='white';ctx.font='bold 25px sans-serif';
 ctx.textAlign='center';ctx.fillText(shopNames[i%shopNames.length],128,41);
 const tex=new THREE.CanvasTexture(c);
 const sign=new THREE.Mesh(
  new THREE.PlaneGeometry(2.6,.65),
  new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
 sign.position.set(x,2.05,z+2.17);
 scene.add(sign);
}

function makeTree(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);
 cylinder(g,0,.8,0,.15,1.6,mat(0x765032));
 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(1.05,8,7),mat(0x277642));
 crown.position.y=2;crown.castShadow=true;g.add(crown);
 scene.add(g);
}
for(let i=0;i<34;i++){
 const z=-i*13-5;
 makeBuilding(-9,z,i);
 if(i%2===0)makeBuilding(9,z-5,i+2);
 makeTree(-6.8,z-6);
 if(i%2)makeTree(6.8,z-8);
}

// Create vehicles with primitive 3D parts
const vehicleTypes={
 rickshaw:{label:'রিকশা',max:15,w:1.25,length:2.25},
 bus:{label:'বাস',max:34,w:2.15,length:5.5},
 cng:{label:'CNG',max:24,w:1.45,length:2.4},
 truck:{label:'ট্রাক',max:29,w:2,length:4.4},
 car:{label:'কার',max:38,w:1.65,length:3.4}
};

function makeVehicle(type){
 const g=new THREE.Group();
 const v=vehicleTypes[type];

 if(type==='rickshaw'){
  cube(g,0,.65,0,1.15,.35,1.5,yellow);
  cube(g,0,1.02,-.18,.92,.45,.72,red);
  cube(g,0,1.36,-.12,.8,.12,.72,yellow);
  cube(g,0,.94,.55,.7,.35,.45,mat(0x7d3027));
  // canopy
  cube(g,0,1.55,-.18,1.15,.12,.9,red);
  cylinder(g,0,.42,-.83,.32,.12,black,Math.PI/2);
  cylinder(g,-.48,.42,.62,.27,.12,black,Math.PI/2);
  cylinder(g,.48,.42,.62,.27,.12,black,Math.PI/2);
  cube(g,0,.75,-1.05,.7,.12,.2,black);
 } else {
  const color=type==='bus'?0xe9b938:
   type==='cng'?0x168d4a:type==='truck'?0xc66a34:0xc73535;
  cube(g,0,.85,0,v.w,.65,v.length,color);
  const cabZ=type==='bus'?-v.length*.25:-v.length*.18;
  cube(g,0,1.4,cabZ,v.w*.9,.75,v.length*.45,color);
  cube(g,0,1.53,cabZ-v.length*.23,v.w*.72,.4,.05,glass);
  cube(g,0,1.03,cabZ-v.length*.24,v.w*.7,.25,.06,glass);
  if(type==='bus'){
   for(let i=0;i<5;i++){
    cube(g,-v.w*.38+i*v.w*.19,1.42,.2, .22,.38,.04,glass);
   }
   cube(g,0,1.05,.4,v.w,.12,.12,yellow);
  }
  if(type==='truck'){
   cube(g,0,1.45,.65,v.w*.9,.9,v.length*.38,mat(0xa9542d));
  }
  const axleZ=[-v.length*.32,v.length*.32];
  for(const z of axleZ){
   cylinder(g,-v.w*.53,.48,z,.28,.17,black,Math.PI/2);
   cylinder(g,v.w*.53,.48,z,.28,.17,black,Math.PI/2);
  }
 }
 return g;
}

let currentType='rickshaw';
let player=makeVehicle(currentType);
player.position.set(0,0,2);
scene.add(player);

const traffic=[];
function spawnTraffic(){
 const types=['rickshaw','cng','bus','truck','car'];
 const type=types[Math.floor(Math.random()*types.length)];
 const g=makeVehicle(type);
 const lane=[-3.7,-1.4,1.4,3.7][Math.floor(Math.random()*4)];
 g.position.set(lane,0,-100-Math.random()*60);
 scene.add(g);
 traffic.push({g,type,lane});
}
for(let i=0;i<9;i++)spawnTraffic();

const input={left:false,right:false,gas:false,brake:false};
let speed=0,meters=0,score=0,paused=true;
let spawnTimer=0;
let hornAudio;

function horn(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!hornAudio)hornAudio=new AC();
  const osc=hornAudio.createOscillator();
  const gain=hornAudio.createGain();
  osc.type='sawtooth';osc.frequency.value=420;
  gain.gain.value=.045;
  osc.connect(gain);gain.connect(hornAudio.destination);
  osc.start();osc.stop(hornAudio.currentTime+.22);
 }catch(e){}
}

function changeVehicle(type){
 scene.remove(player);
 currentType=type;
 player=makeVehicle(type);
 player.position.set(0,0,2);
 scene.add(player);
 document.getElementById('vname').textContent=vehicleTypes[type].label;
}

document.getElementById('vehicle').onchange=e=>changeVehicle(e.target.value);
document.getElementById('pause').onclick=()=>{
 paused=!paused;
 document.getElementById('pause').textContent=paused?'▶ চালাও':'Ⅱ বিরতি';
 document.getElementById('message').textContent=paused?'গেম বিরতিতে':'';
};
document.getElementById('restart').onclick=()=>{
 speed=0;meters=0;score=0;player.position.x=0;
 traffic.forEach(t=>scene.remove(t.g));
 traffic.length=0;
 for(let i=0;i<9;i++)spawnTraffic();
 paused=false;
 document.getElementById('pause').textContent='Ⅱ বিরতি';
 document.getElementById('message').textContent='';
};

function bind(id,key){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();input[key]=true;};
 const up=e=>{e.preventDefault();input[key]=false;};
 el.addEventListener('pointerdown',down);
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
 el.addEventListener('pointerleave',up);
}
bind('left','left');bind('right','right');
bind('gas','gas');bind('brake','brake');
document.getElementById('horn').addEventListener('pointerdown',horn);

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')input.left=true;
 if(e.key==='ArrowRight'||e.key==='d')input.right=true;
 if(e.key==='ArrowUp'||e.key==='w')input.gas=true;
 if(e.key==='ArrowDown'||e.key==='s')input.brake=true;
 if(e.key.toLowerCase()==='h')horn();
});
addEventListener('keyup',e=>{
 if(['ArrowLeft','a'].includes(e.key))input.left=false;
 if(['ArrowRight','d'].includes(e.key))input.right=false;
 if(['ArrowUp','w'].includes(e.key))input.gas=false;
 if(['ArrowDown','s'].includes(e.key))input.brake=false;
});
addEventListener('blur',()=>Object.keys(input).forEach(k=>input[k]=false));

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(!paused){
  const v=vehicleTypes[currentType];
  if(input.gas)speed=Math.min(v.max,speed+12*dt);
  else speed=Math.max(0,speed-2.5*dt);
  if(input.brake)speed=Math.max(0,speed-25*dt);

  if(input.left)player.position.x-=5*dt;
  if(input.right)player.position.x+=5*dt;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-4.6,4.6);
  player.rotation.z=THREE.MathUtils.damp(
   player.rotation.z,input.left?.08:input.right?-.08:0,5,dt);

  const move=speed*dt;
  meters+=move;
  score=Math.floor(meters/2);

  stripes.forEach(s=>{
   s.position.z+=move;
   if(s.position.z>8)s.position.z-=300;
  });
  buildings.forEach(b=>{
   b.position.z+=move;
   if(b.position.z>15)b.position.z-=440;
  });

  spawnTimer+=dt;
  if(spawnTimer>2.2){
   spawnTimer=0;
   spawnTraffic();
  }

  for(let i=traffic.length-1;i>=0;i--){
   const t=traffic[i];
   t.g.position.z+=move*.7+dt*3;
   if(t.g.position.z>12){
    scene.remove(t.g);traffic.splice(i,1);continue;
   }
   const dx=Math.abs(t.g.position.x-player.position.x);
   const dz=Math.abs(t.g.position.z-player.position.z);
   if(dx<(v.w+vehicleTypes[t.type].w)*.42 && dz<1.6 && speed>4){
    speed=0;
    paused=true;
    document.getElementById('message').textContent='ধাক্কা লেগেছে! আবার চালাতে ▶ চাপুন';
    document.getElementById('pause').textContent='▶ চালাও';
   }
  }
  document.getElementById('spd').textContent=Math.round(speed*3.6);
  document.getElementById('dist').textContent=Math.floor(meters);
  document.getElementById('score').textContent=score;
 }

 // Camera follows behind the selected vehicle
 const desired=new THREE.Vector3(
  player.position.x*.48,3.5,8.5);
 camera.position.lerp(desired,.09);
 camera.lookAt(player.position.x*.65,1,-9);

 renderer.render(scene,camera);
}
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
document.getElementById('message').textContent='▶ চালাও চাপুন';
animate();
</script>
</body>
</html>
